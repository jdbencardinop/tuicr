name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mercurial (if missing)
        run: command -v hg || (sudo apt-get update && sudo apt-get install -y mercurial)
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install Jujutsu (if missing)
        run: command -v jj || cargo binstall --strategies crate-meta-data jj-cli --no-confirm
      - run: cargo test

  update-test:
    name: Fork update boundary (${{ matrix.os }})
    needs: [check, fmt]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test retained installer internals
        run: cargo test 'update::'
      - name: Verify fork update command stays disabled
        shell: bash
        run: |
          set -euo pipefail
          extension=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            extension=".exe"
          fi

          cargo build --bin tuicr
          binary="target/debug/tuicr$extension"
          if "$binary" update >"$RUNNER_TEMP/update.stdout" 2>"$RUNNER_TEMP/update.stderr"; then
            echo "fork update unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q "tuicr update.*disabled" "$RUNNER_TEMP/update.stderr"
