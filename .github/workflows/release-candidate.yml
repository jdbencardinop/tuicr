name: Release candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-candidate.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "src/**"
      - "scripts/package-release-artifact.sh"
      - "scripts/import-reviews.sh"
      - "docs/release/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-artifacts:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Record source identity
        shell: bash
        run: echo "TUICR_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build native release binary
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package and smoke-test
        shell: bash
        run: |
          scripts/package-release-artifact.sh \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/tuicr" \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: tuicr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  verify-artifact-set:
    name: Verify four-platform artifact set
    needs: native-artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tuicr-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and target coverage
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
          )
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          for target in "${targets[@]}"; do
            checksum="$(find dist -maxdepth 1 -name "*-${target}.tar.gz.sha256" -print -quit)"
            test -n "$checksum"
            (cd dist && sha256sum --check "$(basename "$checksum")")
          done
