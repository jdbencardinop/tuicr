name: Promote verified candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release candidate workflow run ID
        required: true
        type: string
      version:
        description: Fork prerelease version without v prefix
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Create draft prerelease
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$VERSION" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)"
          workflow_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .path)"
          test "$conclusion" = success
          test "$head_sha" = "$GITHUB_SHA"
          test "$workflow_path" = ".github/workflows/release-candidate.yml"
      - name: Download verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.candidate_run_id }}" --dir dist
      - name: Verify complete artifact set
        run: |
          set -euo pipefail
          find dist -type f -name '*.tar.gz.sha256' -print0 |
            while IFS= read -r -d '' checksum; do
              (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
            done
          test "$(find dist -type f -name '*.tar.gz' | wc -l)" -eq 4
      - name: Create tag and draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "tuicr fork $VERSION"
          git push origin "$tag"
          mapfile -t files < <(find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.version.txt' \) -print)
          gh release create "$tag" "${files[@]}" --draft --prerelease --generate-notes --title "$tag"
