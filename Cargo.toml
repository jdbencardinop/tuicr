[package]
name = "tuicr"
# Offline fork-candidate identity: a semver prerelease tag distinguishes this
# build from real upstream `tuicr` releases (which never publish an
# `-offline-candidate.N` version). The exact source commit is additionally
# embedded at build time (see build.rs) and surfaced via `--version` as
# `<version>+<short-sha>`, so this binary never reports an identity that
# could be mistaken for an unmodified upstream release.
version = "0.19.1-offline-candidate.1"
edition = "2024"
description = "Review AI-generated diffs like a GitHub pull request, right from your terminal."
license = "MIT"
repository = "https://github.com/agavra/tuicr"
homepage = "https://github.com/agavra/tuicr"
readme = "README.md"
keywords = ["tui", "git", "code-review", "diff", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# TUI framework
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which we use to
# measure each line's word-wrapped height with ratatui's own wrapping engine so
# per-row diff backgrounds/overlays align exactly with the rendered text.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# Vim-style modal editing engine for the review comment box (opt-in via
# `comment_vim`). Used as the editing model + input engine only; we keep our
# own rendering, so its widget/clipboard/syntax features are disabled.
edtui = { version = "0.11", default-features = false }

# Git operations
#
# `vendored-libgit2` pins the exact libgit2 build used on every platform to
# the version bundled by the `libgit2-sys` crate (rather than whatever
# libgit2 happens to be installed via Homebrew/apt/etc. on the build host),
# so macOS and Linux offline-candidate builds link an identical, documented
# libgit2 instead of two different system-provided ones. This repo never
# performs network git operations (clone/fetch/push) via git2, so the
# `https`/`ssh` default features are intentionally left disabled.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Utilities
directories = "6.0"
ureq = { version = "3", features = ["json"] }
# Percent-encode dynamic path segments/query values built for the Gitea/
# Forgejo REST transport (`src/forge/giteafj/`). Already resolved
# transitively at this exact version via `ureq`'s own dependency tree
# (see `Cargo.lock`), so this only promotes an already-present, already-
# audited crate to a direct dependency rather than adding a new one.
percent-encoding = "2.3"
unicode-width = "0.2"
uuid = { version = "1.0", features = ["v4"] }
arboard = { version = "3.4", features = ["wayland-data-control"] }
base64 = "0.22"
ignore = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
shlex = "1.3"
sha1 = "0.10"

# `tuicr update`: stage verified binaries and swap the running executable safely.
self-replace = "1.5"
tempfile = "3.24.0"
# `tuicr update`: compare Cargo release versions using SemVer rules.
semver = "1"
# `tuicr update`: verify GitHub's SHA-256 digest.
sha2 = "0.10"
# `tuicr update`: read the published Unix .tar.gz archives.
flate2 = "1"
tar = "0.4"
# `tuicr update`: read the published Windows .zip archive.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

# Syntax highlighting
syntect = "5.2"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }

# Terminal background detection
terminal-colorsaurus = "1"
